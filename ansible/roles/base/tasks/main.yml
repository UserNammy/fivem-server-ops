---
- name: Install base packages
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - git
      - htop
      - jq
      - rsync
      - unattended-upgrades
      - apt-listchanges
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Enable unattended security upgrades
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
    owner: root
    group: root
    mode: "0644"

- name: Set timezone
  community.general.timezone:
    name: "{{ timezone }}"

- name: Create deploy user
  ansible.builtin.user:
    name: "{{ deploy_user }}"
    uid: "{{ deploy_uid }}"
    shell: /bin/bash
    create_home: true
    state: present

- name: Authorize deploy user SSH keys
  ansible.posix.authorized_key:
    user: "{{ deploy_user }}"
    key: "{{ item }}"
    state: present
  loop: "{{ deploy_ssh_public_keys }}"

- name: Harden sshd
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/10-hardening.conf
    content: |
      # Managed by Ansible (fivem-server-ops)
      Port {{ ssh_port }}
      PermitRootLogin {{ 'no' if ssh_disable_root_login else 'prohibit-password' }}
      PasswordAuthentication {{ 'no' if ssh_disable_password_auth else 'yes' }}
      KbdInteractiveAuthentication no
      X11Forwarding no
      MaxAuthTries 3
    owner: root
    group: root
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  notify: Restart sshd

- name: Raise file descriptor limits (FXServer opens many sockets/files)
  ansible.builtin.copy:
    dest: /etc/security/limits.d/90-fivem.conf
    content: |
      {{ deploy_user }} soft nofile 65536
      {{ deploy_user }} hard nofile 65536
    owner: root
    group: root
    mode: "0644"

- name: Tune network buffers for UDP game traffic
  ansible.posix.sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/90-fivem.conf
    reload: true
  loop:
    - { name: net.core.rmem_max, value: "26214400" }
    - { name: net.core.wmem_max, value: "26214400" }
    - { name: net.core.netdev_max_backlog, value: "5000" }
