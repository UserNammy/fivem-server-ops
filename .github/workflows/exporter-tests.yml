name: exporter-tests

on:
  push:
    branches: [main]
    paths:
      - "monitoring/exporter/**"
      - ".github/workflows/exporter-tests.yml"
  pull_request:
    paths:
      - "monitoring/exporter/**"
      - ".github/workflows/exporter-tests.yml"

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: monitoring/exporter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: monitoring/exporter/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -v
