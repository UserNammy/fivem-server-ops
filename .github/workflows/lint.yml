name: lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run shellcheck
        # shellcheck is preinstalled on GitHub-hosted Ubuntu runners
        run: |
          shellcheck --version
          shellcheck -x docker/*.sh backup/*.sh

  hadolint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dockerfile:
          - docker/Dockerfile
          - backup/Dockerfile
          - monitoring/exporter/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ${{ matrix.dockerfile }}
          failure-threshold: warning

  yamllint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install yamllint==1.35.1
      - run: yamllint -s .

  prometheus-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check and unit-test alert rules with promtool
        run: |
          docker run --rm -v "$PWD/monitoring/prometheus:/rules:ro" -w /rules \
            --entrypoint promtool prom/prometheus:v2.54.1 check rules alerts.yml
          docker run --rm -v "$PWD/monitoring/prometheus:/rules:ro" -w /rules \
            --entrypoint promtool prom/prometheus:v2.54.1 test rules alerts_test.yml

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose.yml with the example env
        run: |
          cp .env.example .env
          sed -i 's/^ARTIFACT_BUILD=$/ARTIFACT_BUILD=ci-placeholder/' .env
          docker compose --profile monitoring --profile restore config --quiet

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Scan the full history with the gitleaks CLI. The action computes a
      # `<first>^..<last>` range that breaks on a repository's first push.
      - name: Scan git history for secrets
        run: |
          docker run --rm -u "$(id -u):$(id -g)" -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.24.3 \
            git /repo --redact --verbose
